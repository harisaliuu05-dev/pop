name: Publish the web version

# Copies the game in www/ to the gh-pages branch, which GitHub Pages serves at
# https://harisaliuu05-dev.github.io/pop/ . Runs by itself whenever the game changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: touch www/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
          force_orphan: true

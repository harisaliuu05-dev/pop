name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Generate the app icon and splash screen
        run: npx capacitor-assets generate --android

      - name: Lock the game to portrait
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Copy the game into the app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: lantern-lane-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lantern Lane (latest)
          body: Download app-debug.apk below and open it on your Android phone.
          files: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Google's public test ids are used until you add your own as repository variables
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
      ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID || 'ca-app-pub-3940256099942544/5224354917' }}
      ADMOB_TEST: ${{ vars.ADMOB_REWARDED_ID && 'false' || 'true' }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --legacy-peer-deps

      - name: Fill in the AdMob ids
        run: |
          sed -i "s#__ADMOB_REWARDED_ID__#${ADMOB_REWARDED_ID}#; s#__ADMOB_TEST__#${ADMOB_TEST}#" www/bridge.js

      - name: Create the Android project
        run: npx cap add android

      - name: Generate the app icon and splash screen
        run: npx capacitor-assets generate --android

      - name: Set up the Android manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' $M
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB_APP_ID}\"/></application>#" $M
          grep -q POST_NOTIFICATIONS $M || sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' $M
          grep -q 'com.android.vending.BILLING' $M || sed -i 's#</manifest>#<uses-permission android:name="com.android.vending.BILLING"/></manifest>#' $M
          grep -q 'allowBackup' $M || sed -i 's#<application#<application android:allowBackup="true"#' $M

      - name: Set the version number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Copy the game into the app
        run: npx cap sync android

      - name: Build the test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build the signed Play Store bundle
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/upload.jks
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f $RUNNER_TEMP/upload.jks

      - name: Keep the Play Store bundle
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lantern-lane-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: lantern-lane-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lantern Lane (latest)
          body: Download app-debug.apk below and open it on your Android phone.
          files: android/app/build/outputs/apk/debug/app-debug.apk
